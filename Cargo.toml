[workspace]
resolver = "2"
members = [
    "litertlm-sys",
    "litertlm-rs",
]

[workspace.package]
version       = "0.16.3"
edition       = "2021"
license       = "Apache-2.0"
license-file  = "LICENSE"
repository    = "https://github.com/kiamazi/LiteRT-LM-rs"
homepage      = "https://github.com/kiamazi/LiteRT-LM-rs"
documentation = "https://docs.rs/litertlm-rs"
authors       = ["LiteRT-rs Contributors"]
readme        = "README.md"
keywords      = ["litert", "litert-lm", "tflite", "ml", "inference"]
categories    = ["api-bindings", "science"]

[workspace.dependencies]
litertlm-sys = { version = "0.16.0", path = "litertlm-sys" }
litertlm-rs  = { version = "0.16.0", path = "litertlm-rs" }

bindgen    = "0.70"
serde_json = "1"
reqwest = { version = "0.13.4", features = ["blocking"] }
sha2 = "0.10"
